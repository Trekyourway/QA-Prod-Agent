name: External checks

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Optional comma-separated check codes (empty = all)'
        required: false
        default: ''
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: external-checks
  cancel-in-progress: false

jobs:
  checks:
    name: External checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir playwright==1.49.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run read-only checks
        env:
          QA_CODES: ${{ inputs.codes }}
        run: .venv/bin/python -I qa_prod_agent.py
