name: External checks

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Optional comma-separated check codes (empty = all)'
        required: false
        default: ''
  schedule:
    - cron: '7,37 * * * *'

# Write access is used for one thing only: appending the run's own output to
# the "results" branch of this repository.
permissions:
  contents: write

concurrency:
  group: external-checks
  cancel-in-progress: false

jobs:
  checks:
    name: External checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir playwright==1.63.0 greenlet==3.5.6
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run read-only checks
        env:
          QA_CODES: ${{ inputs.codes }}
          QA_RESULTS_FILE: ${{ runner.temp }}/run.json
        run: .venv/bin/python -I qa_prod_agent.py
      - name: Record the run on the results branch
        if: always()
        env:
          RUN_FILE: ${{ runner.temp }}/run.json
          OUT_DIR: ${{ runner.temp }}/results
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -s "$RUN_FILE" || exit 0
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git clone --quiet --depth 1 --branch results "$REMOTE" "$OUT_DIR" 2>/dev/null; then :; else
            mkdir -p "$OUT_DIR" && cd "$OUT_DIR" && git init --quiet && git checkout --quiet --orphan results && git remote add origin "$REMOTE"
          fi
          cd "$OUT_DIR"
          python3 -I - "$RUN_FILE" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          try:
              history = json.load(open("history.json", encoding="utf-8"))
          except Exception:
              history = []
          history = (history + [run])[-600:]
          json.dump(history, open("history.json", "w", encoding="utf-8"), separators=(",", ":"))
          json.dump(run, open("latest.json", "w", encoding="utf-8"), separators=(",", ":"))
          PY
          git add history.json latest.json
          git -c user.name="qa-prod-agent" -c user.email="qa-prod-agent@users.noreply.github.com" commit --quiet -m "run"
          git push --quiet origin HEAD:results
