name: External checks

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Optional comma-separated check codes (empty = all)'
        required: false
        default: ''
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: external-checks
  cancel-in-progress: false

jobs:
  checks:
    name: External checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir playwright==1.63.0 greenlet==3.5.6
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run read-only checks
        env:
          QA_CODES: ${{ inputs.codes }}
        run: .venv/bin/python -I qa_prod_agent.py
